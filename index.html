<p class="summary">The US House of Representatives voted 211-204 on Tuesday to send eight articles of impeachment against Defense Secretary Pete Hegseth to the Judiciary Committee, effectively halting the effort for this Congress. The articles, introduced by Republican Representative Thomas Massie of Kentucky — the only Republican to vote against the referral — accused Hegseth of waging war against Iran without congressional approval, ordering extrajudicial killings, and ignoring laws meant to protect civilians. Democrats take control of Congress in January, so the impeachment fight is likely to return.</p>

<p class="summary">Miranda Lambert has announced Songline, a nine-track live album arriving November 13, 2026, followed by a concert film on November 20 through Amazon Music. The project captures her October 1 performance at The Truth in Nashville, where she was joined by her longtime band and a 12-piece orchestra. The setlist features familiar favorites including Bluebird, Kerosene, Tin Man, and Gunpowder &amp; Lead, alongside newer material from her album Crisco, and fans can already hear a live version of Snakeskin Boots on Amazon Music.</p>
