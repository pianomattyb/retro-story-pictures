<p class="summary">McLaren driver Lando Norris won a rainy Sao Paulo Grand Prix from pole position, leading 47 of 71 laps and finishing 14.6 seconds clear of Max Verstappen, with Isack Hadjar third. Mercedes clinched its ninth constructors' title, its first since 2021.</p>
