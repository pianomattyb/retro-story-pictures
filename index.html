<p class="summary">The US Bureau of Labor Statistics releases October CPI today, Tuesday, November 10, at 8:30 a.m. ET, the final inflation reading before the Federal Reserve's December meeting. Consensus expects headline CPI up 0.3% month over month and core CPI up 0.2%, cooling from September's 0.6% and 0.3%. This release will carry no year-over-year figures, because October 2025 price data was never collected during the government shutdown.</p>
