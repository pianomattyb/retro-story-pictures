<p class="summary">MSCI has decided to remove Strategy from its indexes, a move that forces index-tracking funds to sell their MSTR holdings by November 30. The decision strikes at the heart of Michael Saylor's Bitcoin treasury model, which relies on index inclusion to keep passive capital flowing into the stock. Strategy is the world's largest corporate holder of Bitcoin, so the forced selling adds fresh pressure to both the shares and the Bitcoin market.</p>
