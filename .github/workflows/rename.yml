name: Publish story page as index.html

on:
  push:
    paths:
      - '.github/workflows/rename.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded page to index.html
        run: |
          git config user.name pianomattyb
          git config user.email pianomattyb@users.noreply.github.com
          git mv tuesday-bitcoin-retro-stories.html index.html
          touch .nojekyll
          rm .github/workflows/rename.yml
          git add -A
          git commit -m "Publish story page as index.html"
          git push
